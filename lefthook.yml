---
pre-commit:
  fail_on_changes: always
  commands:
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}

pre-push:
  commands:
    unittest:
      run: python -m unittest discover -s tests -p "test_*.py"
      glob: "*.py"
